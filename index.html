<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>放置天堂 MOD 書籤執行器</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 32px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      text-align: center;
    }
    h1 {
      color: #f0f6fc;
      font-size: 1.25rem;
      margin-bottom: 24px;
    }
    .bookmark-btn {
      display: inline-block;
      background-color: #238636;
      color: #ffffff;
      padding: 14px 24px;
      font-size: 1rem;
      font-weight: bold;
      text-decoration: none;
      border-radius: 8px;
      margin-bottom: 28px;
      box-shadow: 0 4px 12px rgba(35, 134, 54, 0.4);
      cursor: move;
    }
    .bookmark-btn:hover {
      background-color: #2ea043;
    }
    .instructions {
      background-color: #0d1117;
      border: 1px dashed #30363d;
      border-radius: 8px;
      padding: 20px;
      text-align: left;
    }
    .instructions h2 {
      font-size: 0.95rem;
      color: #58a6ff;
      margin-top: 0;
      margin-bottom: 12px;
    }
    .instructions ol {
      margin: 0;
      padding-left: 20px;
      font-size: 0.85rem;
      line-height: 1.6;
      color: #8b949e;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>⚡ 放置天堂 MOD 執行小工具</h1>
    
    <!-- 這個按鈕點下去會直接抓取 GitHub 上的 GG 原始碼並執行 -->
    <a class="bookmark-btn" href="javascript:(function(){fetch('https://raw.githubusercontent.com/jack1988520-pixel/idle-game-mod/refs/heads/main/GG?t='+Date.now()).then(r=>r.text()).then(c=>{var s=document.createElement('script');s.text=c;document.head.appendChild(s);console.log('✅ 放置天堂 MOD 已啟動');}).catch(e=>alert('❌ 載入失敗: '+e));})();">
      🚀 啟動放置天堂 MOD (拖我到書籤列)
    </a>

    <div class="instructions">
      <h2>📌 使用方式：</h2>
      <ol>
        <li>按住上方<b>綠色按鈕</b>，拖曳到你的瀏覽器<b>「書籤列」</b>放開。</li>
        <li>以後要玩遊戲時，直接打開遊戲頁面，點擊該書籤。</li>
        <li>書籤會自動從 GitHub 下載最新版的 `GG` 程式碼並直接執行！</li>
      </ol>
    </div>
  </div>
</body>
</html>
